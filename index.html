<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heartfield 이동 중...</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      padding: 100px 20px;
      color: #333;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #555;
      margin: 8px 0;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      background: #0066cc;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    a:hover {
      opacity: 0.9;
    }

    .sub {
      margin-top: 18px;
      font-size: 13px;
      color: #888;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div id="msg">
    <h1>잠시만 기다려 주세요...</h1>
    <p>클랜 화면으로 이동 중입니다.</p>
  </div>

  <script>
    // ✅ 이동시키고 싶은 딥링크 주소
    const targetUrl = "https://heartfield.co.kr/mobile/share/clan/6?clan_id=6";

    // ✅ 자동 이동 먼저 시도
    // (카카오톡 인앱브라우저에서는 이게 막힐 수 있음)
    window.location.href = targetUrl;

    // ✅ 일정 시간 후에도 이동이 안 됐으면(앱 실행 실패)
    // 안내 화면 + 버튼 노출
    setTimeout(() => {
      document.getElementById("msg").innerHTML = `
        <h1>📱 앱으로 이동하려면 버튼을 눌러주세요</h1>
        <p>카카오톡/인스타 인앱브라우저에서는 자동 이동이 제한될 수 있습니다.</p>
        <a href="${targetUrl}">🔗 링크 열기</a>
        <div class="sub">
          자동으로 이동되지 않으면<br />
          위 버튼을 눌러 실행해 주세요.
        </div>
      `;
    }, 1200);
  </script>
</body>
</html>
