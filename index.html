<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heartfield</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1b1b24 0%, #0f0f14 60%, #09090c 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(14px);
      text-align: center;
    }

    .logo {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff3cac 0%, #784ba0 50%, #2b86c5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      margin: 0 auto 16px auto;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      font-weight: 800;
    }

    p {
      margin: 0 0 18px 0;
      font-size: 14px;
      color: rgba(255,255,255,0.72);
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 15px 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #ffffff;
      color: #111;
      margin-bottom: 10px;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .small {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
    }

    .hidden {
      display: none;
    }

    .logo img {width:100%; border-radius: 10px;}
  </style>
</head>

<body>
  <div class="card" id="card">
    <div class="logo">
      <img src="/asset/images/heartfield.png" alt="">
    </div>

    <h1 id="title">연결 중...</h1>
    <p id="desc">잠시만 기다려 주세요.</p>

    <button class="btn btn-primary hidden" id="openAppBtn">앱에서 열기</button>
    <button class="btn btn-secondary hidden" id="installBtn">앱 설치하기</button>

    <div class="small" id="smallText"></div>
  </div>

  <script>
    // ==============================
    // 링크 주소
    // ==============================
    const deepLinkUrl = "https://heartfield.co.kr/mobile/share/clan/6?clan_id=6";

    const androidStore = "https://play.google.com/store/apps/details?id=com.brandocean.heartfield&pcampaignid=web_share";
    const iosStore = "https://apps.apple.com/kr/app/heartfield/id6503935002";

    // ==============================
    // UA 체크
    // ==============================
    const ua = navigator.userAgent.toLowerCase();

    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = /android/.test(ua);

    // 카카오톡 인앱브라우저 감지
    // (KAKAOTALK 문자열이 들어감)
    const isKakaoInApp = ua.includes("kakaotalk");

    // ==============================
    // DOM
    // ==============================
    const titleEl = document.getElementById("title");
    const descEl = document.getElementById("desc");
    const openAppBtn = document.getElementById("openAppBtn");
    const installBtn = document.getElementById("installBtn");
    const smallText = document.getElementById("smallText");

    // ==============================
    // 버튼 동작
    // ==============================
    openAppBtn.addEventListener("click", () => {
      window.location.href = deepLinkUrl;
    });

    installBtn.addEventListener("click", () => {
      if (isIOS) window.location.href = iosStore;
      else if (isAndroid) window.location.href = androidStore;
      else window.location.href = deepLinkUrl;
    });

    // ==============================
    // 핵심 로직
    // ==============================

    // 1) 카카오톡 인앱이면: 자동실행을 막고 버튼만 보여줌
    if (isKakaoInApp) {
      titleEl.textContent = "카카오톡에서 열렸어요";
      descEl.textContent = "앱 이동이 막힐 수 있어요. 아래 버튼으로 열어주세요.";

      openAppBtn.classList.remove("hidden");
      installBtn.classList.remove("hidden");

      // smallText.textContent = "오른쪽 위 메뉴 → 기본 브라우저로 열면 더 안정적입니다.";
    }

    // 2) 일반 브라우저면: 자동으로 딥링크 실행 시도
    else {
      titleEl.textContent = "앱으로 이동 중...";
      descEl.textContent = "잠시만 기다려 주세요.";

      // 바로 딥링크 실행
      window.location.href = deepLinkUrl;

      // 만약 앱이 설치되어 있으면 -> 앱으로 넘어가며 페이지는 사라짐
      // 설치되어 있지 않으면 -> 웹에 남아있으므로 1.2초 후 스토어 안내 띄움
      setTimeout(() => {
        titleEl.textContent = "앱이 설치되어 있나요?";
        descEl.textContent = "설치되어 있다면 앱에서 열어주세요. 없다면 설치하기를 눌러주세요.";

        openAppBtn.classList.remove("hidden");
        installBtn.classList.remove("hidden");

        smallText.textContent = "연결이 안 되면 설치 후 다시 시도해 주세요.";
      }, 1200);
    }
  </script>
</body>
</html>
