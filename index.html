<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heartfield</title>

  <style>
    :root {
      --bg: #0b0b0f;
      --card: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --sub: rgba(255, 255, 255, 0.7);
      --line: rgba(255, 255, 255, 0.12);
      --btn: #ffffff;
      --btnText: #0b0b0f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 800px at 50% 20%, #1b1b26 0%, var(--bg) 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f97316 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      user-select: none;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--sub);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: var(--btn);
      color: var(--btnText);
      transition: transform 0.06s ease, opacity 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.secondary {
      margin-top: 10px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      font-weight: 600;
    }

    .hint {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.6;
      color: rgba(255,255,255,0.55);
    }

    .mini {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      text-align: center;
    }

    a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">HF</div>
      <h1 id="title">Heartfield로 이동 중...</h1>
      <p id="desc">잠시만 기다려 주세요.</p>

      <button id="openBtn" class="btn" style="display:none;">
        앱에서 열기
      </button>

      <button id="storeBtn" class="btn secondary" style="display:none;">
        앱 설치하기
      </button>

      <div class="hint" id="hint" style="display:none;"></div>
    </div>

    <div class="mini" id="mini"></div>
  </div>

  <script>
    // ====== 수정할 링크들 ======
    const deepLink = "https://heartfield.co.kr/mobile/share/clan/6?clan_id=6";
    const androidStore = "https://play.google.com/store/apps/details?id=com.brandocean.heartfield&pcampaignid=web_share";
    const iosStore = "https://apps.apple.com/kr/app/heartfield/id6503935002";

    // ====== UA 체크 ======
    const ua = navigator.userAgent.toLowerCase();
    const isAndroid = ua.includes("android");
    const isIOS = ua.includes("iphone") || ua.includes("ipad") || ua.includes("ipod");

    // 카카오톡 인앱브라우저 체크 (iOS/Android 둘 다 잡힘)
    const isKakao = ua.includes("kakaotalk");

    const titleEl = document.getElementById("title");
    const descEl = document.getElementById("desc");
    const openBtn = document.getElementById("openBtn");
    const storeBtn = document.getElementById("storeBtn");
    const hintEl = document.getElementById("hint");
    const miniEl = document.getElementById("mini");

    function showOpenButton() {
      openBtn.style.display = "block";
      openBtn.onclick = () => {
        // 사용자 클릭 이벤트에서만 실행 (iOS 정책상 가장 안전)
        window.location.href = deepLink;
      };
    }

    function showStoreButton(isIOS) {
      storeBtn.style.display = "block";
      storeBtn.onclick = () => {
        window.location.href = isIOS ? iosStore : androidStore;
      };
    }

    function setHint(text) {
      hintEl.style.display = "block";
      hintEl.innerHTML = text;
    }

    // ====== 분기 처리 ======

    // 1) iOS (특히 카카오톡 인앱) : 자동 이동 금지 → 버튼 방식이 최선
    if (isIOS) {
      titleEl.textContent = "앱에서 열어주세요";
      descEl.textContent = "버튼을 누르면 Heartfield 앱으로 연결됩니다.";

      showOpenButton();
      showStoreButton(true);

      // 카톡 인앱이면 안내 추가
      if (isKakao) {
        setHint(`
          카카오톡에서 열 경우 자동 연결이 제한될 수 있어요.<br/>
          <b>‘앱에서 열기’</b> 버튼을 눌러주세요.
        `);
      } else {
        setHint(`
          연결이 안 되면 아래 버튼으로 앱 설치 후 다시 시도해 주세요.
        `);
      }

      miniEl.innerHTML = `<a href="${deepLink}">링크가 안 열리면 여기를 눌러주세요</a>`;
    }

    // 2) Android : 자동 이동 시도 (가능한 환경에서는 바로 열림)
    else if (isAndroid) {
      titleEl.textContent = "Heartfield로 이동 중...";
      descEl.textContent = "앱이 설치되어 있다면 자동으로 열립니다.";

      // Android는 자동 시도
      setTimeout(() => {
        window.location.href = deepLink;
      }, 150);

      // 혹시 막히는 환경 대비 버튼도 보여줌
      setTimeout(() => {
        titleEl.textContent = "자동 연결이 안 되면 버튼을 눌러주세요";
        descEl.textContent = "환경에 따라 자동 연결이 제한될 수 있습니다.";
        showOpenButton();
        showStoreButton(false);
        setHint(`앱이 설치되어 있지 않다면 <b>앱 설치하기</b>를 눌러주세요.`);
      }, 1200);

      miniEl.innerHTML = `<a href="${deepLink}">직접 열기</a>`;
    }

    // 3) PC 등 기타
    else {
      titleEl.textContent = "모바일에서 열어주세요";
      descEl.textContent = "QR을 스마트폰으로 스캔하면 앱으로 연결됩니다.";

      setHint(`
        모바일에서 열면 Heartfield 앱으로 바로 이동합니다.<br/>
        설치가 필요하면 아래 스토어에서 다운로드해 주세요.
      `);

      showStoreButton(false);
      // iOS/Android 둘 다 링크 제공
      miniEl.innerHTML = `
        <a href="${iosStore}" target="_blank">iOS</a>
        &nbsp;·&nbsp;
        <a href="${androidStore}" target="_blank">Android</a>
      `;
    }
  </script>
</body>
</html>
